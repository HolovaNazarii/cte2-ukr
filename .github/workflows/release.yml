name: release

# Реліз створюється автоматично, коли пушиться тег виду v0.1.0.
# Опис релізу береться з release-notes/<тег>.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Check tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties"
            exit 1
          fi

      - name: Build and test
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - uses: softprops/action-gh-release@v2
        with:
          name: CTE2-UK ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: build/libs/CTE2-UK-*.jar
