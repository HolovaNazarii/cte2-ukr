plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = mod_group
version = mod_version
base { archivesName = 'CTE2-UK' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    // Офіційні назви Mojang замість srg (m_91087_ → Minecraft.getInstance()).
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    // Моди зі збірки можна підключати як локальні файли:
    // flatDir { dirs 'libs' }   →   compileOnly fg.deobf("local:mmorpg:6.4.13")  (файл libs/mmorpg-6.4.13.jar)
    // Але для міксинів із @Mixin(targets = "...", remap = false) класи цільового мода не потрібні.
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure { useJUnitPlatform() }

// Друкує SHA-256 файлів для встановлення — щоб вписати в manifest.tsv після зміни файлу
tasks.register('installHashes') {
    def root = file('src/main/resources/cte2_uk/install/files')
    doLast {
        root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
            def md = java.security.MessageDigest.getInstance('SHA-256')
            f.withInputStream { s -> byte[] b = new byte[65536]; int n; while ((n = s.read(b)) > 0) md.update(b, 0, n) }
            println "${root.toPath().relativize(f.toPath()).toString().replace('\\', '/')}\t${md.digest().encodeHex()}"
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, forge_version: forge_version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Зібрати й покласти в теку mods збірки
def sklauncherDir = findProperty('sklauncher_dir') ?: "${System.getenv('APPDATA')}/.sklauncher"
tasks.register('installToGame', Copy) {
    dependsOn 'build'
    from jar.archiveFile
    into "${sklauncherDir}/instances/${instance_name}/mods"
}
